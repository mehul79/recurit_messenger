services:
  - type: web
    name: recruit-sage-watcher
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        value: https://api.recruit.thapar.edu
      - key: SUPABASE_ANON
        sync: false
      - key: PORTAL_EMAIL
        sync: false
      - key: PORTAL_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: NTFY_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TICK_SECRET
        generateValue: true
      - key: PORTAL_REFRESH_TOKEN
        sync: false
